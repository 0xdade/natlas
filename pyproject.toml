[dependency-groups]
dev = [
  "mypy~=1.14",
  "pytest-cov~=6.0",
  "pytest~=8.3",
  "tach~=0.34"
]

[tool.ruff]

[tool.ruff.lint]
ignore = [
  "PLC0414",
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "PLR2004",
  # TODO: audit all mutable ClassVar annotations and re-enable
  "RUF012"
]
select = [
  # flake8-bugbear
  "B",
  # flake8-comprehensions
  "C4",
  # pyflakes
  "F",
  # flynt
  "FLY",
  # isort
  "I",
  # pylint
  "PL",
  # flake8-return
  "RET",
  # Ruff's own rules
  "RUF",
  # flake8-simplify
  "SIM",
  # flake8-tidy-imports
  "TID",
  # pyupgrade
  "UP"
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["agent", "server"]
