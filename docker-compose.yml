##################################
#      DEVELOPMENT USE ONLY      #
# DO NOT USE THIS IN PRODUCTION! #
##################################
services:
  garage:
    image: dxflrs/garage:v1.3.1
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # Admin API
    volumes:
      - ./dev/.garage-dev.toml:/etc/garage.toml
      - garage_data:/var/lib/garage
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3901/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage-init:
    image: alpine:3.21
    networks:
      - backend
    environment:
      - S3_BUCKET=natlas
      - S3_ACCESS_KEY_ID=natlas-dev-key-id-do-not-use
      - S3_SECRET_ACCESS_KEY=natlas-dev-secret-key-do-not-use
    volumes:
      - ./dev/.garage-init.sh:/garage-init.sh:ro
    depends_on:
      garage:
        condition: service_healthy
    command: ["sh", "-c", "apk add -q --no-cache curl jq && sh /garage-init.sh"]

  postgres:
    image: postgres:17.2
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgreql/data
    environment:
      POSTGRES_USER: "natlas"
      POSTGRES_PASSWORD: "natlas-dev-password-do-not-use"
      POSTGRES_DB: "natlas"
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev:latest
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP
    environment:
      - MAILDEV_INCOMING_USER=natlas
      - MAILDEV_INCOMING_PASS=natlas-dev-password-do-not-use
    networks:
      - backend

  authentik-db:
    image: postgres:17.2
    restart: unless-stopped
    environment:
      POSTGRES_USER: "authentik"
      POSTGRES_PASSWORD: "authentik-dev-password-do-not-use"
      POSTGRES_DB: "authentik"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik:
    image: ghcr.io/goauthentik/server:2024.12.3
    command: server
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      AUTHENTIK_SECRET_KEY: "authentik-dev-secret-key-do-not-use-in-prod"
      AUTHENTIK_REDIS__HOST: valkey
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-dev-password-do-not-use
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: info
    networks:
      - backend
    depends_on:
      authentik-db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.12.3
    command: worker
    restart: unless-stopped
    environment:
      AUTHENTIK_SECRET_KEY: "authentik-dev-secret-key-do-not-use-in-prod"
      AUTHENTIK_REDIS__HOST: valkey
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-dev-password-do-not-use
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    networks:
      - backend
    depends_on:
      authentik-db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  zipkin:
    image: openzipkin/zipkin-slim:3.1.0
    ports:
      - 9411:9411
    networks:
      - backend

  otel:
    image: otel/opentelemetry-collector:0.95.0
    ports:
      - 4317:4317
      - 55679:55679
    volumes:
      - ./.otel-collector-dev.yml:/etc/otelcol/config.yaml
    networks:
      - backend
    depends_on:
      zipkin:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Server.Dockerfile
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    networks:
      - backend
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=im-a-really-long-secret-please-dont-share-me
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,server
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=natlas
      - POSTGRES_USER=natlas
      - POSTGRES_PASSWORD=natlas-dev-password-do-not-use
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
      - EMAIL_HOST=maildev
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - EMAIL_HOST_USER=natlas
      - EMAIL_HOST_PASSWORD=natlas-dev-password-do-not-use
      - DEFAULT_FROM_EMAIL=noreply@natlas.test
      - OTEL_ENABLE=True
      - OTEL_COLLECTOR=otel:4317
      - S3_ENDPOINT=http://garage:3900
      - S3_REGION=us-east-1
      - S3_BUCKET=natlas
      - S3_ACCESS_KEY_ID=natlas-dev-key-id-do-not-use
      - S3_SECRET_ACCESS_KEY=natlas-dev-secret-key-do-not-use
      # OIDC — uncomment and fill in after creating an application in Authentik.
      # NOTE: run manage.py runserver locally (not in this container) when testing
      # OIDC so that localhost:9000 resolves from both your browser and Django.
      # All four endpoint URLs come from http://localhost:9000/application/o/<slug>/
      #- OIDC_RP_CLIENT_ID=
      #- OIDC_RP_CLIENT_SECRET=
      #- OIDC_OP_AUTHORIZATION_ENDPOINT=http://localhost:9000/application/o/<slug>/authorize/
      #- OIDC_OP_TOKEN_ENDPOINT=http://localhost:9000/application/o/<slug>/token/
      #- OIDC_OP_USER_ENDPOINT=http://localhost:9000/application/o/<slug>/userinfo/
      #- OIDC_OP_JWKS_ENDPOINT=http://localhost:9000/application/o/<slug>/jwks/
      #- OIDC_DISABLE_LOCAL_AUTH=False
    volumes:
      - ./server:/app
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      otel:
        condition: service_started
      maildev:
        condition: service_started

  celery-worker:
    build:
      context: .
      dockerfile: Server.Dockerfile
      target: dev
    command: celery -A config.celery worker --loglevel=info
    networks:
      - backend
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=im-a-really-long-secret-please-dont-share-me
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=natlas
      - POSTGRES_USER=natlas
      - POSTGRES_PASSWORD=natlas-dev-password-do-not-use
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
    volumes:
      - ./server:/app
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Server.Dockerfile
      target: dev
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - backend
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=im-a-really-long-secret-please-dont-share-me
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=natlas
      - POSTGRES_USER=natlas
      - POSTGRES_PASSWORD=natlas-dev-password-do-not-use
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
    volumes:
      - ./server:/app
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      server:
        condition: service_started

  agent:
    build:
      context: .
      dockerfile: Agent.Dockerfile
    networks:
      - backend
    env_file: agent/.env
    environment:
      - NATLAS_SERVER_ADDRESS=http://server:8000
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    volumes:
      - ./agent:/app/agent
    depends_on:
      server:
        condition: service_started

networks:
  backend:


volumes:
  postgres-data:
  garage_data:
