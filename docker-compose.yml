##################################
#      DEVELOPMENT USE ONLY      #
# DO NOT USE THIS IN PRODUCTION! #
##################################
services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: natlas-dev-password-do-not-use
    volumes:
      - minio_data:/data
    networks:
      - backend
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17.2
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgreql/data
    environment:
      POSTGRES_USER: "natlas"
      POSTGRES_PASSWORD: "natlas-dev-password-do-not-use"
      POSTGRES_DB: "natlas"
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev:latest
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP
    environment:
      - MAILDEV_INCOMING_USER=natlas
      - MAILDEV_INCOMING_PASS=natlas-dev-password-do-not-use
    networks:
      - backend

  zipkin:
    image: openzipkin/zipkin-slim:3.1.0
    ports:
      - 9411:9411
    networks:
      - backend

  otel:
    image: otel/opentelemetry-collector:0.95.0
    ports:
      - 4317:4317
      - 55679:55679
    volumes:
      - ./.otel-collector-dev.yml:/etc/otelcol/config.yaml
    networks:
      - backend
    depends_on:
      zipkin:
        condition: service_healthy

  django:
    build:
      context: .
      dockerfile: Server.Dockerfile
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    networks:
      - backend
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=im-a-really-long-secret-please-dont-share-me
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,django
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=natlas
      - POSTGRES_USER=natlas
      - POSTGRES_PASSWORD=natlas-dev-password-do-not-use
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
      - EMAIL_HOST=maildev
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
      - EMAIL_HOST_USER=natlas
      - EMAIL_HOST_PASSWORD=natlas-dev-password-do-not-use
      - DEFAULT_FROM_EMAIL=noreply@natlas.test
      - OTEL_ENABLE=True
      - OTEL_COLLECTOR=otel:4317
    volumes:
      - ./server:/app
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      otel:
        condition: service_started
      maildev:
        condition: service_started

  celery-worker:
    build:
      context: .
      dockerfile: Server.Dockerfile
      target: dev
    command: celery -A config.celery worker --loglevel=info
    networks:
      - backend
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=im-a-really-long-secret-please-dont-share-me
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=natlas
      - POSTGRES_USER=natlas
      - POSTGRES_PASSWORD=natlas-dev-password-do-not-use
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
    volumes:
      - ./server:/app
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Server.Dockerfile
      target: dev
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - backend
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=im-a-really-long-secret-please-dont-share-me
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=natlas
      - POSTGRES_USER=natlas
      - POSTGRES_PASSWORD=natlas-dev-password-do-not-use
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
    volumes:
      - ./server:/app
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      django:
        condition: service_started

  agent:
    build:
      context: .
      dockerfile: Agent.Dockerfile
    networks:
      - backend
    env_file: agent/.env
    environment:
      - NATLAS_SERVER_ADDRESS=http://django:8000
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    volumes:
      - ./agent:/app/agent
    depends_on:
      django:
        condition: service_started

networks:
  backend:


volumes:
  elastic:
  node_modules:
  html_assets:
  postgres-data:
  minio_data:
