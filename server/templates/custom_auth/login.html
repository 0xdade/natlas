{% extends "base.html" %}

{% block title %}Sign in — Natlas{% endblock %}

{% block extra_css %}
<style>
  .login-wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 5rem;
  }

  .login-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%;
    max-width: 360px;
  }

  .login-card h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
    margin-bottom: 1rem;
  }

  .field label {
    font-size: 0.8125rem;
    color: var(--color-text-muted);
  }

  .field input {
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    color: var(--color-text);
    font-size: 0.875rem;
    padding: 0.5rem 0.75rem;
    width: 100%;
    outline: none;
  }

  .field input:focus {
    border-color: var(--color-accent);
  }

  .error-msg {
    background: color-mix(in srgb, var(--color-down) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--color-down) 40%, transparent);
    border-radius: var(--radius);
    color: var(--color-down);
    font-size: 0.8125rem;
    margin-bottom: 1rem;
    padding: 0.5rem 0.75rem;
  }

  .btn-primary {
    background: var(--color-accent);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 600;
    padding: 0.5rem 1rem;
    width: 100%;
  }

  .btn-primary:hover {
    opacity: 0.9;
  }
</style>
{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <h1>Sign in</h1>
    {% if error %}
    <p class="error-msg">{{ error }}</p>
    {% endif %}
    <form method="post" action="">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div class="field">
        <label for="id_username">Username</label>
        <input id="id_username" type="text" name="username" autofocus autocomplete="username" required>
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <input id="id_password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
