{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Natlas{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: #0f1117;
      --color-surface: #1a1d27;
      --color-border: #2a2d3a;
      --color-text: #e2e4ed;
      --color-text-muted: #7a7f99;
      --color-accent: #6c8ef5;
      --color-up: #4ade80;
      --color-down: #f87171;
      --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
      --font-sans: system-ui, -apple-system, sans-serif;
      --radius: 6px;
    }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100dvh;
    }

    a { color: var(--color-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    nav.site-nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }

    nav.site-nav .brand {
      font-weight: 700;
      font-size: 1rem;
      color: var(--color-text);
      letter-spacing: -0.01em;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
    }

    footer.site-footer {
      padding: 0.75rem 1.5rem;
      border-top: 1px solid var(--color-border);
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }
  </style>
  {% block extra_css %}{% endblock %}
  <meta name="description" content="Natlas is an open source project designed to provide scalable network scanning and an interface to search through the results. For more information, visit github.com/natlas/natlas">
  <meta name="author" content="Natlas Authors">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16x16.png' %}">
  <link rel="manifest" href="{% static 'site.webmanifest' %}">
  <link rel="mask-icon" href="{% static 'img/safari-pinned-tab.svg' %}" color="#5bbad5">
  <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}">
  <meta name="msapplication-TileColor" content="#2b5797">
  <meta name="msapplication-config" content="{% static 'browserconfig.xml' %}">
  <meta name="theme-color" content="#ffffff">
</head>
<body>
  <nav class="site-nav">
    <span class="brand">Natlas</span>
    <a href="{% url 'web:dashboard' %}">Dashboard</a>
    <a href="{% url 'web:hosts' %}">Hosts</a>
    {% if request.user.is_staff %}<a href="{% url 'admin:index' %}">Admin</a>{% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">{{ git_version }}</footer>
</body>
</html>
