{% load static %}
<style>
  .search-bar {
    display: flex;
    gap: 0.5rem;
  }

  .search-bar textarea {
    flex: 1;
    padding: 0.5rem 0.75rem;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    color: var(--color-text);
    font-family: var(--font-mono);
    font-size: 0.875rem;
    outline: none;
    transition: border-color 0.15s;
    min-height: 2rem;
  }

  .search-bar textarea:focus {
    border-color: var(--color-accent);
  }

  .search-bar textarea.has-error {
    border-color: var(--color-down);
  }

  .search-bar button {
    padding: 0.5rem 1rem;
    background: var(--color-accent);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    font-size: 0.875rem;
    cursor: pointer;
  }

  .search-bar button:hover {
    opacity: 0.85;
  }

  .search-error {
    font-size: 0.8rem;
    color: var(--color-down);
    font-family: var(--font-mono);
    margin-top: 0.25rem;
  }
</style>

<form method="get" action="">
  <div class="search-bar">
    <textarea type="text" name="q" placeholder="Search e.g. target == &quot;10.0.0.1&quot;"
      autocomplete="off" spellcheck="false" rows="2" class="{% if error %}has-error{% endif %}">{{ q }}</textarea>
    <button type="submit">Search</button>
  </div>
  {% if error %}
  <p class="search-error">{{ error }}</p>
  {% endif %}
</form>
<script>
  DjangoQL.DOMReady(function () {
    new DjangoQL({
      // either JS object with a result of DjangoQLSchema(MyModel).as_dict(),
      // or an URL from which this information could be loaded asynchronously
      introspections: {{ introspections| safe }},

    selector: '.search-bar textarea',

    // optional, you can provide URL for Syntax Help link here.
    // If not specified, Syntax Help link will be hidden.
    syntaxHelp: null,

    // optional, enable textarea auto-resize feature. If enabled,
    // textarea will automatically grow its height when entered text
    // doesn't fit, and shrink back when text is removed. The purpose
    // of this is to see full search query without scrolling, could be
    // helpful for really long queries.
    autoResize: true
      });
    });
</script>
