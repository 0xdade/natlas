<style>
  .host-meta {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 0.75rem 1rem;
    flex-wrap: wrap;

    .host-ip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 600;
      min-width: 10rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.up   { background: var(--color-up); }
    .status-dot.down { background: var(--color-down); }

    .host-attrs {
      display: flex;
      gap: 1.5rem;
      flex: 1;
      flex-wrap: wrap;
    }

    .host-attr {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .host-attr-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
    }

    .host-attr-value {
      font-size: 0.85rem;
      font-family: var(--font-mono);
    }

    .host-tags {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .tag {
      background: color-mix(in srgb, var(--color-accent) 15%, transparent);
      border: 1px solid color-mix(in srgb, var(--color-accent) 35%, transparent);
      border-radius: 3px;
      color: var(--color-accent);
      font-size: 0.75rem;
      padding: 0.1rem 0.45rem;
      text-decoration: none;
      white-space: nowrap;
    }

    .tag:hover {
      background: color-mix(in srgb, var(--color-accent) 25%, transparent);
      text-decoration: none;
    }
  }
</style>

<div class="host-meta">
  <div class="host-ip">
    <span class="status-dot {% if result.is_up %}up{% else %}down{% endif %}"></span>
    <a href="{% url 'web:host_detail' target=result.target %}">{{ result.target }}</a>
  </div>

  <div class="host-attrs">
    <div class="host-attr">
      <span class="host-attr-label">Ports</span>
      <span class="host-attr-value">{{ result.port_count|default:"—" }}</span>
    </div>

    <div class="host-attr">
      <span class="host-attr-label">Scanned</span>
      <span class="host-attr-value">{{ result.scanned_at|date:"Y-m-d H:i" }}</span>
    </div>

    <div class="host-attr">
      <span class="host-attr-label">Agent</span>
      <span class="host-attr-value">
        {% if result.agent %}
          <a href="{% url 'web:hosts' %}?q=agent%20%3D%20%22{{ result.agent.id }}%22">{{ result.agent }}</a>
        {% else %}
          —
        {% endif %}
      </span>
    </div>
  </div>

  {% if result.tags %}
  <div class="host-tags">
    {% for tag in result.tags %}
    <a class="tag" href="{% url 'web:hosts' %}?q=tag%20%3D%20%22{{ tag }}%22">{{ tag }}</a>
    {% endfor %}
  </div>
  {% endif %}
</div>
